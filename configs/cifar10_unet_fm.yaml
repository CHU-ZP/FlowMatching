dataset: cifar10
data_dir: ./datasets
image_size: 32

model: unet
in_channels: 3
base_channels: 64
channel_mult: [1, 2, 2]
num_res_blocks: 2
time_embedding_dim: 256
dropout: 0.0
class_conditional: true
num_classes: 10

batch_size: 128
num_workers: 4
epochs: 100
lr: 0.0002
weight_decay: 0.01
optimizer: adamw
max_grad_norm: 1.0
seed: 42

ema: true
ema_decay: 0.999

out_dir: ./runs/cifar10_fm
log_every_steps: 50
save_every_epochs: 10
sample_every_epochs: 10
num_sample_images: 64
num_steps_sampling: 50
sampling_method: euler
