[project]
name = "cifar10-flow-matching"
version = "0.1.0"
description = "Pixel-space class-conditional Flow Matching demo on CIFAR-10."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=2.20",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "torch>=2.10,<2.12",
    "torchvision>=0.25,<0.27",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
